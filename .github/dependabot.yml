# Keep direct deps and Actions pins on a weekly review cadence.
# uv.lock updates land as PRs; merge after CI (lint/test + SBOM) is green.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
