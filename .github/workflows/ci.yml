name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --locked --group dev
      - name: Ruff lint
        run: uv run ruff check ssd tests
      - name: Ruff format
        run: uv run ruff format --check ssd tests
      - name: Type check
        run: uv run mypy ssd
      - name: Tests
        run: uv run pytest -q

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync deps
        # Locked install so the SBOM matches the committed uv.lock tree.
        # Include extras so optional chrome/leveldb packages appear in the inventory.
        run: uv sync --locked --all-extras --group dev
      - name: Export CycloneDX SBOM and hashed requirements
        run: |
          uv export --frozen --format cyclonedx1.5 --no-emit-workspace --all-extras --group dev \
            -o sbom.cdx.json
          uv export --frozen --no-emit-workspace --all-extras --group dev \
            -o sbom-requirements.txt
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.cdx.json
            sbom-requirements.txt
            uv.lock
